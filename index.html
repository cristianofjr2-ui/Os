<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Aeron OS 2.0</title>

<style>
/* =========================================================
   AERON OS 2.0
   Interface experimental
   ========================================================= */

:root {
    --black: #000000;
    --white: #ffffff;
    --soft: rgba(255,255,255,.62);
    --glass: rgba(255,255,255,.075);
    --line: rgba(255,255,255,.11);
    --accent: #5bbcff;
}

/* ---------- RESET ---------- */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #101010;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    color: white;
}

/* ---------- PHONE ---------- */

.phone {
    width: 380px;
    height: 790px;

    position: relative;
    overflow: hidden;

    background: #000;

    border: 7px solid #252525;
    border-radius: 48px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        inset 0 0 0 1px rgba(255,255,255,.08);

    isolation: isolate;
}

/* ---------- SCREEN ---------- */

.screen {
    position: absolute;
    inset: 0;

    overflow: hidden;

    background: #000;

    will-change:
        transform,
        opacity;

    transform: translateZ(0);
}

/* =========================================================
   STATUS BAR
   ========================================================= */

.status-bar {
    position: absolute;

    top: 15px;
    left: 22px;
    right: 22px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 100;

    font-size: 12px;
    font-weight: 600;

    pointer-events: none;
}

.status-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-icon {
    opacity: .92;
}

/* bateria */

.battery {
    width: 24px;
    height: 11px;

    border: 1px solid rgba(255,255,255,.75);
    border-radius: 3px;

    padding: 1px;

    position: relative;
}

.battery::after {
    content: "";

    position: absolute;

    right: -3px;
    top: 3px;

    width: 2px;
    height: 5px;

    background: white;
    border-radius: 0 1px 1px 0;
}

.battery-level {
    width: 82%;
    height: 100%;

    background: white;
    border-radius: 1px;
}

/* =========================================================
   LOCK SCREEN
   ========================================================= */

#lock-screen {
    z-index: 20;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: space-between;

    padding:
        105px
        25px
        58px;

    opacity: 1;

    transform:
        translate3d(0,0,0)
        scale(1);

    transition:
        opacity .30s cubic-bezier(.4,0,1,1),
        transform .42s cubic-bezier(.22,.8,.24,1);
}

/* horário */

.lock-time {
    text-align: center;
}

.time {
    font-size: 76px;

    line-height: .95;

    font-weight: 300;

    letter-spacing: -4px;

    color: #fff;

    text-shadow:
        0 0 25px rgba(255,255,255,.04);
}

.date {
    margin-top: 13px;

    font-size: 15px;

    color: rgba(255,255,255,.58);

    font-weight: 500;
}

/* mensagem */

.lock-hint {
    position: absolute;

    bottom: 151px;

    font-size: 12px;

    color: rgba(255,255,255,.42);

    letter-spacing: .2px;
}

/* =========================================================
   BIOMETRIA
   ========================================================= */

.biometric-area {
    display: flex;
    flex-direction: column;

    align-items: center;

    gap: 13px;
}

/* botão */

.fingerprint {
    width: 76px;
    height: 76px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.18);

    background:
        radial-gradient(
            circle,
            rgba(91,188,255,.12),
            rgba(0,0,0,0) 65%
        );

    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--accent);

    cursor: pointer;

    position: relative;

    transition:
        transform .16s cubic-bezier(.2,.9,.2,1),
        border-color .2s ease,
        background .2s ease;

    box-shadow:
        0 0 0 0 rgba(91,188,255,0);
}

/* círculo interno */

.fingerprint::before {
    content: "";

    width: 47px;
    height: 47px;

    border-radius: 50%;

    border: 1px solid rgba(91,188,255,.38);

    position: absolute;

    transition:
        transform .25s ease,
        opacity .25s ease;
}

/* símbolo */

.fingerprint-symbol {
    font-size: 28px;

    position: relative;

    z-index: 2;

    filter:
        drop-shadow(0 0 8px rgba(91,188,255,.25));
}

/* toque */

.fingerprint:active {
    transform: scale(.91);

    border-color:
        rgba(91,188,255,.8);

    background:
        radial-gradient(
            circle,
            rgba(91,188,255,.25),
            rgba(0,0,0,0) 70%
        );
}

/* animação biometria */

.fingerprint.scanning {
    animation:
        biometricPulse .38s cubic-bezier(.2,.8,.2,1);
}

.fingerprint.scanning::before {
    animation:
        biometricRing .55s cubic-bezier(.2,.8,.2,1);
}

@keyframes biometricPulse {

    0% {
        transform: scale(1);
    }

    35% {
        transform: scale(.90);
    }

    65% {
        transform: scale(1.07);
    }

    100% {
        transform: scale(1);
    }
}

@keyframes biometricRing {

    0% {
        transform: scale(.82);
        opacity: .8;
    }

    100% {
        transform: scale(1.45);
        opacity: 0;
    }
}

/* =========================================================
   HOME SCREEN
   ========================================================= */

#home-screen {
    z-index: 10;

    opacity: 0;

    pointer-events: none;

    transform:
        translate3d(0,18px,0)
        scale(.965);

    transition:
        opacity .42s cubic-bezier(.22,.8,.24,1),
        transform .52s cubic-bezier(.16,1,.3,1);

    padding:
        58px
        22px
        25px;
}

/* =========================================================
   HOME HEADER
   ========================================================= */

.home-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 30px;
}

.home-greeting {
    display: flex;
    flex-direction: column;

    gap: 4px;
}

.home-small {
    font-size: 12px;

    color:
        rgba(255,255,255,.45);
}

.home-title {
    font-size: 25px;

    font-weight: 650;

    letter-spacing: -.7px;
}

.profile-button {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #242424,
            #0d0d0d
        );

    border: 1px solid rgba(255,255,255,.12);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;

    cursor: pointer;

    transition:
        transform .18s ease;
}

.profile-button:active {
    transform: scale(.88);
}

/* =========================================================
   APP GRID
   ========================================================= */

.app-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    column-gap: 13px;
    row-gap: 26px;
}

/* app */

.app {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;

    cursor: pointer;

    transform: translateZ(0);

    transition:
        transform .18s cubic-bezier(.2,.8,.2,1);
}

.app:active {
    transform: scale(.88);
}

/* ícone */

.icon {
    width: 61px;
    height: 61px;

    border-radius: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 27px;

    border: 1px solid rgba(255,255,255,.08);

    box-shadow:
        0 9px 24px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.13);

    transition:
        transform .18s ease,
        filter .18s ease;
}

.app:active .icon {
    filter: brightness(1.2);
}

/* nomes */

.app-name {
    color: rgba(255,255,255,.86);

    font-size: 11px;

    font-weight: 500;

    white-space: nowrap;
}

/* =========================================================
   ÍCONES
   ========================================================= */

.gallery {
    background:
        linear-gradient(
            135deg,
            #ff416c,
            #ff4b2b
        );
}

.camera {
    background:
        linear-gradient(
            135deg,
            #4facfe,
            #00f2fe
        );
}

.music {
    background:
        linear-gradient(
            135deg,
            #11998e,
            #38ef7d
        );
}

.settings {
    background:
        linear-gradient(
            135deg,
            #777,
            #dedede
        );
}

.browser {
    background:
        linear-gradient(
            135deg,
            #4776e6,
            #8e54e9
        );
}

.messages {
    background:
        linear-gradient(
            135deg,
            #00b09b,
            #96c93d
        );
}

.calendar {
    background:
        linear-gradient(
            135deg,
            #ff512f,
            #dd2476
        );
}

.notes {
    background:
        linear-gradient(
            135deg,
            #f7971e,
            #ffd200
        );
}

/* =========================================================
   WIDGET
   ========================================================= */

.widget {
    margin-top: 33px;

    width: 100%;

    min-height: 116px;

    border-radius: 25px;

    border: 1px solid var(--line);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04);

    padding: 19px;

    display: flex;
    flex-direction: column;

    justify-content: space-between;
}

.widget-top {
    display: flex;

    justify-content: space-between;

    align-items: center;
}

.widget-label {
    font-size: 11px;

    color: rgba(255,255,255,.42);
}

.widget-value {
    font-size: 23px;

    font-weight: 600;

    letter-spacing: -.7px;
}

.widget-bottom {
    font-size: 11px;

    color: rgba(255,255,255,.46);
}

/* =========================================================
   DOCK
   ========================================================= */

.dock {
    position: absolute;

    bottom: 17px;

    left: 50%;

    transform: translateX(-50%);

    width: calc(100% - 45px);

    height: 74px;

    border-radius: 25px;

    border: 1px solid rgba(255,255,255,.09);

    background:
        rgba(255,255,255,.055);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    display: flex;

    align-items: center;
    justify-content: space-evenly;

    box-shadow:
        0 15px 35px rgba(0,0,0,.45);
}

.dock .icon {
    width: 50px;
    height: 50px;

    border-radius: 15px;

    font-size: 23px;
}

/* =========================================================
   NAVIGATION BAR
   ========================================================= */

.gesture-bar {
    position: absolute;

    bottom: 7px;

    left: 50%;

    transform: translateX(-50%);

    width: 105px;
    height: 4px;

    border-radius: 99px;

    background: rgba(255,255,255,.65);

    z-index: 200;
}

/* =========================================================
   APP OVERLAY
   ========================================================= */

.app-window {
    position: absolute;

    inset: 0;

    z-index: 150;

    background: #000;

    opacity: 0;

    pointer-events: none;

    transform:
        translateY(100%)
        scale(.97);

    transition:
        transform .45s cubic-bezier(.16,1,.3,1),
        opacity .3s ease;

    padding: 65px 25px 30px;
}

.app-window.open {
    opacity: 1;

    pointer-events: auto;

    transform:
        translateY(0)
        scale(1);
}

.app-window-header {
    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 35px;
}

.app-window-icon {
    width: 48px;
    height: 48px;

    border-radius: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
}

.app-window-title {
    font-size: 25px;

    font-weight: 650;
}

.close-app {
    margin-left: auto;

    width: 38px;
    height: 38px;

    border: 0;

    border-radius: 50%;

    background: rgba(255,255,255,.08);

    color: white;

    font-size: 20px;

    cursor: pointer;
}

.app-placeholder {
    height: 300px;

    border-radius: 25px;

    border: 1px solid rgba(255,255,255,.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    display: flex;

    align-items: center;
    justify-content: center;

    color: rgba(255,255,255,.35);

    text-align: center;

    padding: 25px;
}

/* =========================================================
   UNLOCKED STATE
   ========================================================= */

.phone.unlocked #lock-screen {

    opacity: 0;

    pointer-events: none;

    transform:
        translate3d(0,-55px,0)
        scale(.985);
}

.phone.unlocked #home-screen {

    opacity: 1;

    pointer-events: auto;

    transform:
        translate3d(0,0,0)
        scale(1);
}

/* =========================================================
   HOME ICON ENTRANCE
   ========================================================= */

.phone.unlocked .app {
    animation:
        appAppear .55s cubic-bezier(.16,1,.3,1) both;
}

.phone.unlocked .app:nth-child(1) {
    animation-delay: .04s;
}

.phone.unlocked .app:nth-child(2) {
    animation-delay: .065s;
}

.phone.unlocked .app:nth-child(3) {
    animation-delay: .09s;
}

.phone.unlocked .app:nth-child(4) {
    animation-delay: .115s;
}

.phone.unlocked .app:nth-child(5) {
    animation-delay: .14s;
}

.phone.unlocked .app:nth-child(6) {
    animation-delay: .165s;
}

.phone.unlocked .app:nth-child(7) {
    animation-delay: .19s;
}

.phone.unlocked .app:nth-child(8) {
    animation-delay: .215s;
}

@keyframes appAppear {

    from {
        opacity: 0;

        transform:
            translateY(15px)
            scale(.86);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================================================
   RESPONSIVIDADE
   ========================================================= */

@media (max-height: 700px) {

    .phone {
        transform: scale(.85);
    }
}

@media (max-width: 420px) {

    body {
        background: #000;
    }

    .phone {
        width: 100vw;
        height: 100vh;

        border: 0;

        border-radius: 0;

        box-shadow: none;
    }
}
</style>
</head>

<body>

<div class="phone" id="aeron-phone">

    <!-- =====================================================

    <section id="lock-screen" class="screen">

        <div class="status-bar">

            <span id="lock-status-time">

            </span>

<script>
/* =========================================================
   AERON OS ENGINE
   ========================================================= */

const phone =
    document.getElementById("aeron-phone");

const fingerprint =
    document.getElementById("fingerprint");

const lockScreen =
    document.getElementById("lock-screen");

const appWindow =
    document.getElementById("app-window");

const windowTitle =
    document.getElementById("window-title");

const windowIcon =
    document.getElementById("window-icon");

const windowDescription =
    document.getElementById("window-description");

const closeApp =
    document.getElementById("close-app");


/* =========================================================
   RELÓGIO
   ========================================================= */

function updateClock() {

    const now = new Date();

    const hours =
        String(now.getHours()).padStart(2, "0");

    const minutes =
        String(now.getMinutes()).padStart(2, "0");

    const time =
        `${hours}:${minutes}`;

    const weekdays = [
        "Domingo",
        "Segunda-feira",
        "Terça-feira",
        "Quarta-feira",
        "Quinta-feira",
        "Sexta-feira",
        "Sábado"
    ];

    const months = [
        "janeiro",
        "fevereiro",
        "março",
        "abril",
        "maio",
        "junho",
        "julho",
        "agosto",
        "setembro",
        "outubro",
        "novembro",
        "dezembro"
    ];

    const weekday =
        weekdays[now.getDay()];

    const day =
        now.getDate();

    const month =
        months[now.getMonth()];


    document.getElementById("clock").textContent =
        time;

    document.getElementById("lock-status-time").textContent =
        time;

    document.getElementById("home-status-time").textContent =
        time;

    document.getElementById("widget-time").textContent =
        time;

    document.getElementById("date").textContent =
        `${weekday}, ${day} de ${month}`;

    document.getElementById("widget-date").textContent =
        `${weekday} · ${day} de ${month}`;
}

updateClock();

setInterval(updateClock, 1000);


/* =========================================================
   DESBLOQUEIO
   ========================================================= */

let unlocked = false;

function unlockAeron() {

    if (unlocked)
        return;

    unlocked = true;


    /*
       Primeiro feedback físico do botão.
    */

    fingerprint.classList.remove("scanning");

    void fingerprint.offsetWidth;

    fingerprint.classList.add("scanning");


    /*
       Pequeno intervalo para a biometria
       parecer reconhecer o toque antes
       da troca de tela.
    */

    setTimeout(() => {

        phone.classList.add("unlocked");

    }, 230);
}


fingerprint.addEventListener(
    "click",
    unlockAeron
);


/* =========================================================
   ABRIR APLICATIVOS
   ========================================================= */

document.querySelectorAll(".app").forEach(app => {

    app.addEventListener("click", () => {

        const name =
            app.dataset.app;

        const icon =
            app.dataset.icon;

        const iconClass =
            app.dataset.class;


        windowTitle.textContent =
            name;

        windowIcon.textContent =
            icon;

        windowIcon.className =
            `app-window-icon ${iconClass}`;

        windowDescription.textContent =
            `${name} está sendo executado no Aeron OS.`;


        appWindow.classList.add("open");
    });

});


/* =========================================================
   FECHAR APLICATIVO
   ========================================================= */

closeApp.addEventListener("click", () => {

    appWindow.classList.remove("open");

});


/* =========================================================
   GESTO / TOQUE NA BARRA
   ========================================================= */

const gestureBar =
    document.querySelector(".gesture-bar");

gestureBar.addEventListener("click", () => {

    if (appWindow.classList.contains("open")) {

        appWindow.classList.remove("open");

        return;
    }

    /*
       Se quiser bloquear novamente,
       toque duas vezes na barra.
    */

});


let lastTap = 0;

gestureBar.addEventListener("dblclick", () => {

    if (!unlocked)
        return;

    appWindow.classList.remove("open");

    unlocked = false;

    phone.classList.remove("unlocked");

});


/* =========================================================
   PREVENÇÃO DE ZOOM / SCROLL NO PROTÓTIPO
   ========================================================= */

document.addEventListener(
    "touchmove",
    event => {
        event.preventDefault();
    },
    { passive: false }
);


/* =========================================================
   FIM DO AERON OS ENGINE
   ========================================================= */
</script>
