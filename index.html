<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeron OS</title>
    <style>
        /* Reset de respeito para não dar bronca de alinhamento */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fundo fora do celular */
        body {
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Chassi do Aeron */
        .aeron-device {
            width: 380px;
            height: 790px;
            background: #000000; /* Preto AMOLED 100% cabuloso */
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            border: 8px solid #1a1a1a;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        /* Telas base */
        .screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* --- TELA DE BLOQUEIO --- */
        #lock-screen {
            z-index: 10;
            align-items: center;
            justify-content: space-between;
            padding: 90px 0 60px 0;
            /* Transição suave deslizando para cima */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
        }

        .clock-container {
            text-align: center;
        }
        
        .time {
            color: #ffffff;
            font-size: 82px;
            font-weight: 200;
            letter-spacing: -3px;
        }
        
        .date {
            color: #888888;
            font-size: 16px;
            margin-top: -5px;
            font-weight: 500;
        }

        /* Botão Biométrico com Micro-animação Elástica */
        .biometrics {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #00f2fe;
            font-size: 38px;
            /* Efeito elástico super fluido */
            transition: transform 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55), background 0.3s;
        }

        .biometrics:active {
            transform: scale(0.85);
            background: rgba(0, 242, 254, 0.1);
        }

        /* --- TELA INICIAL (HOME) --- */
        #home-screen {
            z-index: 5;
            padding: 80px 25px;
            opacity: 0;
            transform: scale(0.92); /* Efeito de profundidade: vem do fundo */
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px 15px;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.2s ease;
        }
        
        .app-icon:active {
            transform: scale(0.9); /* Micro-animação nos apps também */
        }

        .app-label {
            color: #ffffff;
            font-size: 12px;
            font-weight: 500;
        }

        /* Cores Premium dos Apps */
        .bg-camera { background: linear-gradient(135deg, #ff758c, #ff7eb3); }
        .bg-gallery { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
        .bg-music { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .bg-settings { background: linear-gradient(135deg, #434343, #282828); }

        /* --- A MÁGICA DA ANIMAÇÃO (ACIONADA PELO JAVASCRIPT) --- */
        /* Some com a tela de bloqueio jogando ela pra cima */
        .aeron-device.unlocked #lock-screen {
            opacity: 0;
            transform: translateY(-60px);
            pointer-events: none;
        }

        /* Traz a tela inicial pra frente */
        .aeron-device.unlocked #home-screen {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="aeron-device" id="device">
        
        <!-- Tela de Bloqueio -->
        <div id="lock-screen" class="screen">
            <div class="clock-container">
                <div class="time">18:45</div>
                <div class="date">Dom, 13 de Set.</div>
            </div>
            
            <div class="biometrics" onclick="desbloquear()">
                ◎
            </div>
        </div>
        
        <!-- Tela Inicial -->
        <div id="home-screen" class="screen">
            <div class="app-grid">
                <div class="app-container">
                    <div class="app-icon bg-camera">📸</div>
                    <div class="app-label">Câmera</div>
                </div>
                <div class="app-container">
                    <div class="app-icon bg-gallery">🖼️</div>
                    <div class="app-label">Galeria</div>
                </div>
                <div class="app-container">
                    <div class="app-icon bg-music">🎵</div>
                    <div class="app-label">Música</div>
                </div>
                <div class="app-container">
                    <div class="app-icon bg-settings">⚙️</div>
                    <div class="app-label">Ajustes</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function desbloquear() {
            // Essa linha pega o celular e adiciona a classe "unlocked", disparando as animações CSS!
            document.getElementById('device').classList.add('unlocked');
        }
    </script>
</body>
</html>
