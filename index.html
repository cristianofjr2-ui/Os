<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OriginOS Community Web Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #08090c;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Chassi do Dispositivo */
    .phone {
      width: 380px;
      height: 790px;
      background: #000;
      border-radius: 54px;
      border: 9px solid #232328;
      box-shadow: 0 30px 80px rgba(0,0,0,0.85);
      position: relative;
      overflow: hidden;
    }

    /* Camada de Papel de Parede e Ícones sujeita a Blur Dinâmico */
    .system-layer {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 10% 20%, #e04a68 0%, #6825b8 50%, #0d0822 100%);
      will-change: filter, transform;
      transform-origin: center center;
    }

    /* Lanterna / Flash */
    .torch-layer {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 120;
      transition: opacity 0.2s ease;
    }
    .torch-layer.on {
      opacity: 0.96;
    }

    /* Barra de Status e Atomic Island */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
    }

    .island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #fff;
      height: 30px;
      min-width: 110px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      font-size: 12px;
      cursor: pointer;
      z-index: 110;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .island.active {
      min-width: 180px;
      height: 34px;
      background: rgba(15, 15, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .island-dot {
      width: 8px;
      height: 8px;
      background: #ff4757;
      border-radius: 50%;
      display: none;
    }
    .island.active .island-dot {
      display: block;
      animation: pulse 1s infinite alternate ease-in-out;
    }

    @keyframes pulse {
      from { opacity: 0.4; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.3); }
    }

    /* Grade de Aplicativos */
    .home-content {
      padding: 90px 24px 30px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .clock-widget {
      color: #fff;
      padding-left: 6px;
    }
    .clock-widget h1 {
      font-size: 54px;
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 1;
    }
    .clock-widget p {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-top: 6px;
    }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 14px;
    }

    .icon-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .app-icon {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon-wrapper:active .app-icon {
      transform: scale(0.86);
    }

    .app-label {
      color: #fff;
      font-size: 11px;
      font-weight: 500;
    }

    .icon-clock { background: linear-gradient(135deg, #ff9900, #ff416c); }
    .icon-tiktok { background: #010101; border: 1px solid rgba(255,255,255,0.12); }
    .icon-control { background: linear-gradient(135deg, #4b6cb7, #182848); }

    /* Janela Flutuante com Suporte a Interrupção de Animação */
    .app-window {
      position: absolute;
      inset: 0;
      background: #0f1015;
      border-radius: 50px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 24px 40px;
      color: #fff;
      pointer-events: none;
      opacity: 0;
      transform-origin: center center;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      will-change: transform, opacity, border-radius;
    }

    .stopwatch-num {
      font-size: 60px;
      font-weight: 200;
      text-align: center;
      font-variant-numeric: tabular-nums;
      margin-top: 40px;
    }

    .btn-action {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      background: #00e676;
      color: #000;
    }

    /* Painel de Controle Deslizante */
    .control-center {
      position: absolute;
      inset: 0;
      background: rgba(14, 14, 18, 0.78);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      z-index: 105;
      padding: 60px 20px 20px;
      transform: translateY(-100%);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .control-center.open {
      transform: translateY(0);
    }

    .cc-tile {
      width: 140px;
      height: 110px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.15s ease;
    }
    .cc-tile:active {
      transform: scale(0.93);
    }
    .cc-tile.active {
      background: #ffb703;
      color: #000;
    }

    /* Barra de Gestos Inferior */
    .gesture-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 5px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      z-index: 150;
      cursor: grab;
      touch-action: none;
    }
  </style>
</head>
<body>

  <div class="phone" id="phone">
    <!-- Camada que sofre o efeito de desfoque -->
    <div class="system-layer" id="systemLayer">
      <div class="home-content">
        <div class="clock-widget">
          <h1 id="clock">12:00</h1>
          <p>OriginOS Engine</p>
        </div>

        <div class="icon-grid">
          <div class="icon-wrapper" id="timerIcon" onclick="handleAppToggle()">
            <div class="app-icon icon-clock">⏱</div>
            <span class="app-label">Relógio</span>
          </div>

          <div class="icon-wrapper" onclick="toggleControlCenter()">
            <div class="app-icon icon-control">⚙</div>
            <span class="app-label">Painel</span>
          </div>

          <div class="icon-wrapper">
            <div class="app-icon icon-tiktok">♪</div>
            <span class="app-label">TikTok</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Lanterna -->
    <div class="torch-layer" id="torch"></div>

    <!-- Barra de Status com Atomic Island -->
    <div class="status-bar">
      <span id="statTime">12:00</span>
      <div class="island" id="island" onclick="restoreFromIsland()">
        <div class="island-dot"></div>
        <span id="islandLabel">OriginOS</span>
      </div>
      <span>5G</span>
    </div>

    <!-- Janela Flutuante do Aplicativo -->
    <div class="app-window" id="appWindow">
      <div style="text-align: center; font-weight: 600;">Cronômetro</div>
      <div class="stopwatch-num" id="swDisplay">00:00.00</div>
      <button class="btn-action" id="swBtn" onclick="toggleTimer()">Iniciar</button>
    </div>

    <!-- Central de Controle -->
    <div class="control-center" id="controlCenter">
      <div style="display: flex; justify-content: space-between; color: #fff; margin-bottom: 20px;">
        <h3>Centro de Controle</h3>
        <span style="cursor: pointer;" onclick="toggleControlCenter()">✕</span>
      </div>
      <div class="cc-tile" id="torchBtn" onclick="toggleTorch()">
        <span style="font-size: 26px;">🔦</span>
        <strong>Lanterna</strong>
      </div>
    </div>

    <!-- Home Gesture Bar -->
    <div class="gesture-bar" id="gestureBar"></div>
  </div>

  <script>
    // Relógio do Sistema
    function updateClock() {
      const d = new Date();
      const t = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      document.getElementById('clock').innerText = t;
      document.getElementById('statTime').innerText = t;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Cronômetro
    let timerRunning = false;
    let timerStart = 0;
    let elapsed = 0;
    let timerId = null;

    function formatTime(ms) {
      const m = String(Math.floor(ms / 60000)).padStart(2, '0');
      const s = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
      const cs = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');
      return `${m}:${s}.${cs}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('swBtn');
      if (!timerRunning) {
        timerRunning = true;
        timerStart = Date.now() - elapsed;
        timerId = setInterval(() => {
          elapsed = Date.now() - timerStart;
          const fmt = formatTime(elapsed);
          document.getElementById('swDisplay').innerText = fmt;
          if (document.getElementById('island').classList.contains('active')) {
            document.getElementById('islandLabel').innerText = fmt.slice(0, 5);
          }
        }, 10);
        btn.innerText = 'Pausar';
        btn.style.background = '#ff4757';
        btn.style.color = '#fff';
      } else {
        timerRunning = false;
        clearInterval(timerId);
        btn.innerText = 'Continuar';
        btn.style.background = '#00e676';
        btn.style.color = '#000';
      }
    }

    // Motor de Animação com Interrupção Física e Blur Dinâmico
    const appWindow = document.getElementById('appWindow');
    const systemLayer = document.getElementById('systemLayer');
    const island = document.getElementById('island');
    const islandLabel = document.getElementById('islandLabel');

    let currentAnim = null;
    let isOpen = false;

    function animateApp(toOpen) {
      // 1. Interrupção instantânea da animação anterior
      let startProgress = 0;
      if (currentAnim) {
        const computedTrans = window.getComputedStyle(appWindow).transform;
        currentAnim.cancel(); // Para exatamente no frame atual
      }

      isOpen = toOpen;
      appWindow.style.pointerEvents = toOpen ? 'auto' : 'none';

      // Origem do ícone para abertura fluida
      const originTransform = 'scale(0.18) translateY(120px)';
      const openTransform = 'scale(1) translateY(0px)';

      const keyframes = toOpen
        ? [
            { transform: originTransform, opacity: 0, borderRadius: '60px' },
            { transform: openTransform, opacity: 1, borderRadius: '50px' }
          ]
        : [
            { transform: openTransform, opacity: 1, borderRadius: '50px' },
            { transform: originTransform, opacity: 0, borderRadius: '60px' }
          ];

      // Curva com overshoot suave (spring)
      currentAnim = appWindow.animate(keyframes, {
        duration: 420,
        easing: 'cubic-bezier(0.25, 1.2, 0.45, 1)',
        fill: 'forwards'
      });

      // Blur progressivo sincronizado no wallpaper e nos apps de fundo
      systemLayer.animate(
        toOpen
          ? [
              { filter: 'blur(0px) brightness(1)', transform: 'scale(1)' },
              { filter: 'blur(16px) brightness(0.7)', transform: 'scale(0.94)' }
            ]
          : [
              { filter: 'blur(16px) brightness(0.7)', transform: 'scale(0.94)' },
              { filter: 'blur(0px) brightness(1)', transform: 'scale(1)' }
            ],
        {
          duration: 420,
          easing: 'cubic-bezier(0.25, 1.2, 0.45, 1)',
          fill: 'forwards'
        }
      );
    }

    function handleAppToggle() {
      animateApp(!isOpen);
    }

    // Gesto de Arrastar para a Ilha Dinâmica (Absorção Elástica)
    let startY = 0;
    let dragging = false;
    const gestureBar = document.getElementById('gestureBar');

    gestureBar.addEventListener('pointerdown', (e) => {
      if (!isOpen) return;
      dragging = true;
      startY = e.clientY;
      gestureBar.setPointerCapture(e.pointerId);
    });

    gestureBar.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const deltaY = e.clientY - startY;
      if (deltaY < 0) {
        // Resistência dinâmica tipo OriginOS
        const scale = Math.max(0.4, 1 + deltaY / 700);
        appWindow.style.transform = `translateY(${deltaY * 0.75}px) scale(${scale})`;
      }
    });

    gestureBar.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;
      const deltaY = e.clientY - startY;

      if (deltaY < -70) {
        // Encolhe em direção à Atomic Island no topo
        appWindow.animate([
          { transform: appWindow.style.transform, opacity: 1, borderRadius: '50px' },
          { transform: 'scale(0.1) translateY(-400px)', opacity: 0, borderRadius: '100px' }
        ], {
          duration: 400,
          easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.2)',
          fill: 'forwards'
        });

        systemLayer.animate([
          { filter: 'blur(16px)', transform: 'scale(0.94)' },
          { filter: 'blur(0px)', transform: 'scale(1)' }
        ], { duration: 350, fill: 'forwards' });

        isOpen = false;
        appWindow.style.pointerEvents = 'none';

        setTimeout(() => {
          if (timerRunning) {
            island.classList.add('active');
            islandLabel.innerText = formatTime(elapsed).slice(0, 5);
          }
        }, 300);
      } else {
        // Rebote de volta para tela cheia caso não puxe o suficiente
        appWindow.style.transform = '';
        animateApp(true);
      }
    });

    function restoreFromIsland() {
      if (island.classList.contains('active')) {
        island.classList.remove('active');
        islandLabel.innerText = 'OriginOS';
        animateApp(true);
      }
    }

    // Lanterna e Central de Controle
    const controlCenter = document.getElementById('controlCenter');
    const torch = document.getElementById('torch');
    const torchBtn = document.getElementById('torchBtn');

    function toggleControlCenter() {
      controlCenter.classList.toggle('open');
    }

    function toggleTorch() {
      torch.classList.toggle('on');
      torchBtn.classList.toggle('active');
    }
  </script>
</body>
  </html>
